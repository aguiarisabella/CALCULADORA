<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Rosa Pastel</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fff0f5; /* Fundo da tela: Rosa bem clarinho */
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .calculadora {
            background-color: #ffe4e1; /* Corpo da calculadora: Rosa pastel */
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0px 8px 20px rgba(255, 182, 193, 0.4);
            border: 2px solid #ffb6c1;
        }
        #tela {
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            border: 2px solid #ffb6c1;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: right;
            padding: 5px 15px;
            box-sizing: border-box;
            border-radius: 12px;
            color: #ff69b4; /* Números digitados em rosa escuro */
        }
        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            padding: 20px;
            font-size: 1.3rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background-color: #ffffff; /* Botões normais: Brancos */
            color: #ff85a2; /* Números dos botões: Rosa sutil */
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0px 3px 0px #ffccd5;
        }
        button:hover { 
            background-color: #fff0f3; 
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(1px);
            box-shadow: none;
        }
        button.operador { 
            background-color: #ffb6c1; /* Botões de operação: Rosa pastel médio */
            color: white; 
            box-shadow: 0px 3px 0px #f39ba7;
        }
        button.operador:hover { background-color: #ffa4b2; }
        
        button.limpar { 
            background-color: #ff85a2; /* Botão C: Rosa mais marcante */
            color: white; 
            box-shadow: 0px 3px 0px #e06885;
        }
        button.limpar:hover { background-color: #ff6b8e; }
    </style>
</head>
<body>

    <div class="calculadora">
        <!-- Tela de exibição -->
        <input type="text" id="tela" readonly>
        
        <!-- Teclado da calculadora -->
        <div class="botoes">
            <button class="limpar" onclick="limparTela()">C</button>
            <button onclick="adicionar('/')" class="operador">/</button>
            <button onclick="adicionar('*')" class="operador">*</button>
            <button onclick="adicionar('-')" class="operador">-</button>
            
            <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button onclick="adicionar('+')" class="operador">+</button>
            
            <button onclick="adicionar('4')">4</button>
            <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button onclick="calcular()" class="operador" style="grid-row: span 2; height: 100%;">=</button>
            
            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
            
            <button onclick="adicionar('0')" style="grid-column: span 2;">0</button>
            <button onclick="adicionar('.')">.</button>
        </div>
    </div>

    <script>
        const tela = document.getElementById('tela');

        function adicionar(valor) {
            tela.value += valor;
        }

        function limparTela() {
            tela.value = '';
        }

        function calcular() {
            try {
                tela.value = eval(tela.value);
            } catch (error) {
                tela.value = 'Erro';
            }
        }
    </script>
</body>
</html>
